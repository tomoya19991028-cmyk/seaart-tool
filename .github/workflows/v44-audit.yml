name: v44 audit
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'manifest.json'
      - 'scripts/build-current.py'
      - 'tests/v44-audit/**'
      - 'package*.json'
      - '.github/workflows/v44-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-audit-evidence
          path: .audit-tmp/
          retention-days: 14
